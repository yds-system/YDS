<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공지사항 · 홍익인간 CMS</title>
  <script>try{var t=JSON.parse(localStorage.getItem("cmsA.theme"));if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app" data-page="notice" data-crumb="홈 / 게시판 / 공지사항">
    <div class="main">
      <main class="content">
        <div class="page-head reveal">
          <div>
            <h1 class="page-title">공지사항</h1>
            <p class="page-desc">사이트에 노출되는 공지 글을 등록하고 게시 상태를 관리하세요.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn--secondary" id="btn-excel">엑셀 다운로드</button>
            <button type="button" class="btn btn--primary" id="btn-write">+ 글쓰기</button>
          </div>
        </div>

        <section class="card reveal" style="--i:1" aria-label="공지사항 목록">
          <div class="tabs" role="tablist" id="tabs"></div>
          <form class="filter-row" id="filters" role="search">
            <select class="select" name="cat" style="width:154px" aria-label="분류">
              <option value="">전체 분류</option><option>강좌</option><option>시스템</option><option>운영</option><option>행사</option>
            </select>
            <select class="select" name="scope" style="width:143px" aria-label="검색 범위">
              <option value="both">제목+내용</option><option value="title">제목</option><option value="author">작성자</option>
            </select>
            <input class="input grow" name="q" type="search" placeholder="검색어를 입력하세요" aria-label="검색어" style="max-width:352px">
            <button type="submit" class="btn btn--secondary">검색</button>
            <p class="count" aria-live="polite">총 <b class="num" id="count">0</b> 건</p>
            <select class="select" id="per" style="width:154px" aria-label="페이지당 개수">
              <option value="10" selected>10개씩 보기</option><option value="20">20개씩 보기</option><option value="50">50개씩 보기</option>
            </select>
          </form>
          <div class="table-wrap">
            <table class="table">
              <caption class="sr-only">공지사항 목록</caption>
              <colgroup><col style="width:57px"><col style="width:84px"><col style="width:92px"><col><col style="width:121px"><col style="width:132px"><col style="width:99px"><col style="width:99px"><col style="width:77px"></colgroup>
              <thead>
                <tr>
                  <th scope="col" id="th-all"></th>
                  <th scope="col">번호</th>
                  <th scope="col">분류</th>
                  <th scope="col" class="is-left">제목</th>
                  <th scope="col">작성자</th>
                  <th scope="col" aria-sort="descending"><button type="button" class="sort" data-sort="date">등록일</button></th>
                  <th scope="col" class="is-right" aria-sort="none"><button type="button" class="sort" data-sort="views">조회</button></th>
                  <th scope="col">상태</th>
                  <th scope="col">관리</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="card-foot">
            <div class="inline-row" style="gap:9px">
              <span class="total" id="sel-count">0개 선택</span>
              <button type="button" class="btn btn--secondary btn--sm" id="bulk-hide" disabled>선택 숨김</button>
              <button type="button" class="btn btn--ghost-danger btn--sm" id="bulk-del" disabled>선택 삭제</button>
            </div>
            <nav class="pagination" id="pager" aria-label="페이지 이동"></nav>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/notice.js"></script>
</body>
</html>

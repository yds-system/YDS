<style>
  /* TOC 너비 확장 — 기본 10rem(100~160px)에서 220px으로 */
  .sbdocs-wrapper > aside {
    width: 220px !important;
    flex-shrink: 0 !important;
  }
  .sbdocs-wrapper > aside > nav {
    width: 220px !important;
  }
  /* 색상을 제외한 토큰 정의서 페이지는 TOC 숨김 */
  html.sb-no-toc .sbdocs-wrapper > aside {
    display: none !important;
  }
</style>
<script>
(function () {
  function update() {
    var params = new URLSearchParams(window.location.search);
    var id = '';
    try { id = decodeURIComponent(params.get('id') || ''); } catch (e) {}
    // 토큰 정의서 페이지는 모두 사이드바 TOC 숨김 (인라인 TOC로 대체)
    var hide = id.includes('토큰-정의서');
    document.documentElement.classList.toggle('sb-no-toc', hide);
  }
  update();
  setInterval(update, 300);
})();
</script>
